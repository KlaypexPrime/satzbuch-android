plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'de.klaypex.satzbuch'
    compileSdk 34

    defaultConfig {
        applicationId 'de.klaypex.satzbuch'
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Signing key comes from GitHub secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD) – never stored in the repo.
    // Always the same key, so every new build installs as an update over the old one (your data stays).
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'satzbuch'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
